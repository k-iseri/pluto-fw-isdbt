# FT232H モジュールを JTAG アダプタとして Zynq-7000 に接続する OpenOCD 設定。
# 配線（FT232H の MPSSE 標準割当。モジュールのシルクは AD0..AD3 / D0..D3 表記のことが多い）:
#   AD0 (D0) -> TCK
#   AD1 (D1) -> TDI
#   AD2 (D2) -> TDO
#   AD3 (D3) -> TMS
#   GND      -> GND
#   基板の 3.3V 穴は接続しない（両者とも 3.3V ロジックなので GND 共通だけでよい。
#   電源レール同士を繋ぐと逆流の恐れがある）
# 使い方: openocd -f scripts/ft232h-zynq.cfg
#   → telnet localhost 4444 で対話、または recover_nano_openocd.tcl 参照

adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
ftdi layout_init 0x0008 0x000b
adapter speed 1000
transport select jtag

source [find target/zynq_7000.cfg]
